<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detection Application</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="static/mywebscript.js"></script>
    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            max-width: 750px;
            margin-top: 60px;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 {
            color: #2c3e50;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
        }
        .btn-custom {
            background-color: #27ae60;
            color: white;
            font-weight: 600;
            padding: 10px 25px;
            border-radius: 6px;
            border: none;
            transition: background-color 0.2s;
        }
        .btn-custom:hover {
            background-color: #219150;
            color: white;
        }
        #system_response {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: #eef2f7;
            font-size: 1.1rem;
            color: #333;
            min-height: 50px;
            border-left: 5px solid #27ae60;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotion Detector</h1>
        <p class="text-muted text-center mb-4">Enter a statement below to analyze its emotional profile and discover its dominant emotion.</p>
        <div class="form-group">
            <label for="textToAnalyze"><strong>Enter Text:</strong></label>
            <input type="text" class="form-control form-control-lg" id="textToAnalyze" placeholder="Type a sentence here...">
        </div>
        <div class="text-center">
            <button class="btn btn-custom" onclick="RunSentimentAnalysis()">Run Sentiment Analysis</button>
        </div>
        <div id="system_response"></div>
    </div>
</body>
</html>
